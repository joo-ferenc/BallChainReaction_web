<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EAF4FF">
<title>Ball Chain Reaction</title>
<script>window.KG_IMGLIST = []; /* saját képek: ide írd a fájlneveket kiterjesztés nélkül, pl. ['ball_red', 'bg_w1'] */</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BallChain">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--u:1px;--ink:#1B2A4A;--ink2:#4A5A72;--bg:#EAF4FF;--card:#FFFFFF;--line:#D6E2F0;--acc:#FF8A3D;--acc2:#6C5CE7;--ok:#22B573;--side:clamp(230px,26vw,340px)}
@media (min-height:560px){:root{--u:1.2px}}
@media (min-height:760px){:root{--u:1.45px}}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink)}
.fd{font-family:Fredoka,Nunito,system-ui,sans-serif}
#app{position:relative;width:100%;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.screen.on{display:flex}
button{font:inherit;color:inherit;border:none;cursor:pointer;background:none;padding:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:calc(14*var(--u));font-family:Fredoka,Nunito,sans-serif;font-weight:600;color:var(--ink);transition:transform .1s, box-shadow .1s}
.btn:active{transform:translateY(2px) scale(.98)}
.card,.b-card{background:var(--card);box-shadow:0 2px 0 rgba(27,42,74,.06),0 8px 24px rgba(27,42,74,.08)}
.b-acc{background:linear-gradient(180deg,#FFA25E,#FF7A2F);color:#fff;box-shadow:0 4px 0 #D9601A,0 10px 24px rgba(255,122,47,.3)}
.b-ok{background:linear-gradient(180deg,#3CCB8A,#1FA866);color:#fff;box-shadow:0 4px 0 #168556,0 10px 24px rgba(34,181,115,.28)}
.b-pur{background:linear-gradient(180deg,#8A7CF0,#6C5CE7);color:#fff;box-shadow:0 4px 0 #5243C2}
.b-ghost{background:#F1F6FC;color:var(--ink)}
.dis{opacity:.4;pointer-events:none}
.icon-btn{width:calc(44*var(--u));height:calc(44*var(--u));border-radius:calc(14*var(--u));flex:none}
.icon-btn svg{width:calc(22*var(--u));height:calc(22*var(--u))}
.pill{display:flex;align-items:center;gap:6px;border-radius:999px;padding:0 14px 0 10px;height:calc(40*var(--u));font-weight:800;font-size:calc(17*var(--u))}
.top{display:flex;align-items:center;gap:10px;padding:calc(12*var(--u)) 16px calc(6*var(--u))}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.ttl small{font-size:calc(11*var(--u));font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl b{font-family:Fredoka,Nunito,sans-serif;font-size:calc(21*var(--u));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* főmenü */
#home{background:radial-gradient(1200px 500px at 70% -10%,#FFE7D1 0,rgba(255,231,209,0) 60%),radial-gradient(900px 500px at 0% 110%,#E3DDFF 0,rgba(227,221,255,0) 60%),var(--bg)}
#home .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:calc(28*var(--u));padding:0 24px calc(18*var(--u))}
#home .brand{display:flex;flex-direction:column;gap:6px;max-width:46%}
#home h1{margin:0;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:calc(48*var(--u));line-height:.95;letter-spacing:.5px}
#home h1 span{color:var(--acc)}
#home .tag{font-size:calc(16*var(--u));font-weight:700;color:var(--ink2)}
#home .menu{display:flex;flex-direction:column;gap:calc(12*var(--u));width:min(340px,40vw)}
#home .menu .btn{height:calc(58*var(--u));font-size:calc(21*var(--u));justify-content:flex-start;padding:0 18px}
#home .menu .btn small{margin-left:auto;font-family:Nunito,sans-serif;font-weight:800;font-size:calc(13*var(--u));opacity:.85}
#hero{width:calc(260*var(--u));height:calc(170*var(--u));max-width:40vw}
/* világok / pályák */
.scroll{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;padding:4px 16px 18px}
#worldGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.wcard{border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:calc(118*var(--u));text-align:left;position:relative;overflow:hidden}
.wcard b{font-family:Fredoka,sans-serif;font-weight:600;font-size:calc(17*var(--u))}
.wcard small{font-weight:800;font-size:calc(12*var(--u));color:var(--ink2)}
.wcard .bar{height:6px;border-radius:3px;background:#E6EEF8;margin-top:auto;overflow:hidden}
.wcard .bar i{display:block;height:100%;background:var(--ok)}
.wcard.lock{opacity:.55}
.wcard .num{position:absolute;right:10px;top:4px;font-family:Fredoka;font-weight:700;font-size:calc(40*var(--u));opacity:.12}
#lvGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;max-width:900px;margin:0 auto}
.lvb{aspect-ratio:1.25;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:Fredoka,Nunito,sans-serif;font-weight:700;font-size:calc(24*var(--u))}
.lvb small{font-family:Nunito;font-size:calc(11*var(--u));font-weight:800;color:var(--ink2);max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvb .s{display:flex;gap:2px}
.lvb.lock{background:#E9EFF6;color:#9AA8BA}
.lvb.master{outline:2px dashed #FFB27A;outline-offset:-6px}
/* játék */
#game{flex-direction:row;background:#DCEBFA}
#stage{flex:1;position:relative;min-width:0;display:flex;align-items:center;justify-content:center}
#cv{display:block;border-radius:16px;touch-action:none;box-shadow:0 10px 30px rgba(27,42,74,.15)}
#side{flex:none;width:var(--side);background:#fff;display:flex;flex-direction:column;min-height:0;box-shadow:-8px 0 24px rgba(27,42,74,.08)}
#side .top{padding:calc(10*var(--u)) 12px 4px}
.goal{margin:4px 12px 0;padding:calc(8*var(--u)) 12px;border-radius:12px;background:#FFF4EA;color:#8A4A12;font-weight:800;font-size:calc(13*var(--u));display:flex;gap:8px;align-items:center}
.tools{display:flex;align-items:center;gap:8px;padding:calc(8*var(--u)) 12px 0}
.tools .sp{flex:1}
#gStars{display:flex;gap:2px}
#gStars svg{width:calc(22*var(--u));height:calc(22*var(--u))}
#items{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(8*var(--u));padding:calc(10*var(--u)) 12px;align-content:start;touch-action:pan-y}
.item{height:calc(76*var(--u));border-radius:14px;background:#F3F7FC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:calc(11*var(--u));font-weight:800;position:relative;touch-action:pan-y;border:2px solid transparent}
.item.sel{border-color:var(--acc);background:#FFF4EA}
.item canvas{width:calc(64*var(--u));height:calc(44*var(--u))}
.item .n{position:absolute;top:5px;right:6px;background:var(--ink);color:#fff;border-radius:999px;padding:0 7px;font-size:calc(11*var(--u));line-height:1.6}
.item.zero{opacity:.35}
#editbar{display:none;gap:6px;padding:0 12px calc(8*var(--u))}
#editbar.on{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
#zoomReset{position:absolute;right:16px;top:16px;z-index:5;display:none;width:calc(44*var(--u));height:calc(44*var(--u));border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 4px 14px rgba(27,42,74,.18);align-items:center;justify-content:center}
#zoomReset.on{display:flex}
#stage{touch-action:none}
#editbar .btn{flex:1;height:calc(40*var(--u));font-size:calc(14*var(--u))}
.acts{display:flex;gap:8px;padding:0 12px calc(12*var(--u))}
.acts .btn{height:calc(52*var(--u));font-size:calc(19*var(--u))}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;padding:9px 16px;border-radius:14px;font-size:calc(14*var(--u));pointer-events:none;opacity:0;transition:opacity .25s;max-width:90%;text-align:center;z-index:5}
.toast.on{opacity:1}
.empty{grid-column:1/-1;color:var(--ink2);font-weight:800;font-size:calc(12*var(--u));padding:6px;text-align:center}
/* ablak */
#modal{position:absolute;inset:0;background:rgba(20,30,55,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#modal.on{display:flex}
.mcard{background:#fff;border-radius:26px;padding:calc(20*var(--u)) calc(22*var(--u));width:100%;max-width:calc(640*var(--u));max-height:100%;overflow:auto;display:flex;gap:calc(20*var(--u));align-items:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mcard .cl,.mcard .cr{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:calc(10*var(--u))}
.mcard.small{max-width:calc(420*var(--u));flex-direction:column}
.mcard h2{margin:0;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:calc(34*var(--u));line-height:1}
.mcard p{margin:0;text-align:center;font-weight:700;font-size:calc(15*var(--u));color:var(--ink2)}
.bigstars{display:flex;align-items:flex-end;gap:4px}
.bigstars svg{width:calc(54*var(--u));height:calc(54*var(--u))}
.bigstars .mid svg{width:calc(72*var(--u));height:calc(72*var(--u))}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.mcard .btn{height:calc(48*var(--u));font-size:calc(18*var(--u));width:100%}
.newtool{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#F1EDFF,#FFF1E6);border-radius:16px;padding:10px 14px;width:100%}
.newtool canvas{width:calc(80*var(--u));height:calc(56*var(--u));flex:none}
.newtool b{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:calc(17*var(--u))}
.newtool small{font-size:calc(11*var(--u));font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--acc2)}
/* gyűjtemény */
#colGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.cbox{border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:calc(11*var(--u));text-align:center;min-height:calc(96*var(--u))}
.cbox canvas{width:calc(70*var(--u));height:calc(50*var(--u))}
.cbox.lock{background:#E9EFF6;color:#9AA8BA}
.cbox .q{font-family:Fredoka;font-size:calc(30*var(--u));line-height:calc(50*var(--u))}
.sec{font-family:Fredoka;font-weight:600;font-size:calc(18*var(--u));margin:12px 0 8px}
.set{flex:1;min-height:0;padding:6px 16px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;overflow-y:auto;align-content:start}
.setrow{border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:calc(15*var(--u));flex-wrap:wrap}
.setrow .sp{flex:1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:10px;background:#EEF3F9;font-weight:800;font-size:calc(14*var(--u))}
.seg button.on{background:var(--ink);color:#fff}
#rotate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:50}
@media (orientation:portrait){#rotate{display:flex}}
.native #rotate{display:none!important}
#rotate .ph{width:min(40vw,200px);height:min(40vw,200px)}
#rotate .dev{transform-origin:60px 60px;animation:kbRot 2.4s ease-in-out infinite}
#rotate .arr{animation:kbArr 2.4s ease-in-out infinite}
@keyframes kbRot{0%,15%{transform:rotate(0deg)}45%,80%{transform:rotate(-90deg)}100%{transform:rotate(0deg)}}
@keyframes kbArr{0%,10%{opacity:0}20%,45%{opacity:1}60%,100%{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <section class="screen" id="home">
    <div class="top">
      <button class="btn b-card icon-btn" id="btnSettings" aria-label="Beállítások"><svg viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>
      <div class="pill b-card"><span class="starico"></span><span id="homeStars">0</span></div>
      <div style="flex:1"></div>
      <button class="btn icon-btn" id="btnExit" aria-label="Kilépés" style="display:none;background:#FFE1E6;box-shadow:0 3px 0 #F3B7C2"><svg viewBox="0 0 24 24" fill="none" stroke="#B3264A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"></path><path d="M6.3 6.3a8 8 0 1 0 11.4 0"></path></svg></button>
    </div>
    <div class="mid">
      <div class="brand">
        <canvas id="hero" width="520" height="340"></canvas>
        <h1>Ball Chain<br><span>Reaction</span></h1>
        <div class="tag" data-t="tagline"></div>
      </div>
      <div class="menu">
        <button class="btn b-acc" id="mPlay"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z" fill="#fff"></path></svg><span data-t="play"></span><small id="mPlayInfo"></small></button>
        <button class="btn b-card" id="mCol"><span data-t="collection"></span><small id="mColInfo"></small></button>
        <button class="btn b-card" id="mSand"><span data-t="sandbox"></span></button>
      </div>
    </div>
  </section>

  <section class="screen" id="worlds">
    <div class="top">
      <button class="btn b-card icon-btn back" data-go="home" aria-label="Vissza"><svg viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <div class="ttl"><small data-t="play"></small><b data-t="worlds"></b></div>
      <div class="pill b-card"><span class="starico"></span><span id="wStars">0</span></div>
    </div>
    <div class="scroll"><div id="worldGrid"></div></div>
  </section>

  <section class="screen" id="levels">
    <div class="top">
      <button class="btn b-card icon-btn back" data-go="worlds" aria-label="Vissza"><svg viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <div class="ttl"><small id="lvSub"></small><b id="lvTitle"></b></div>
      <div class="pill b-card"><span class="starico"></span><span id="lvStars">0</span></div>
    </div>
    <div class="scroll"><div id="lvGrid"></div></div>
  </section>

  <section class="screen" id="game">
    <div id="stage"><canvas id="cv"></canvas><button id="zoomReset" aria-label="Eredeti nézet"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M8 11h6M16.5 16.5L21 21"></path></svg></button><div class="toast" id="toast"></div></div>
    <div id="side">
      <div class="top">
        <button class="btn b-ghost icon-btn" id="gBack" aria-label="Vissza"><svg viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <div class="ttl"><small id="gSub"></small><b id="gTitle"></b></div>
      </div>
      <div class="goal" id="gGoal"></div>
      <div class="tools">
        <div id="gStars"></div><div class="sp"></div>
        <button class="btn b-ghost icon-btn" id="gHint" aria-label="Tipp"><svg viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg></button>
        <button class="btn b-ghost icon-btn" id="gSpeed" aria-label="Gyorsítás" style="font-size:calc(15*var(--u));font-weight:700">1×</button>
      </div>
      <div id="items"></div>
      <div id="editbar">
        <button class="btn b-ghost" id="eRotL" aria-label="Forgatás balra"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></button>
        <button class="btn b-ghost" id="eRotR" aria-label="Forgatás jobbra"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg></button>
        <button class="btn b-ghost" id="eFlip" aria-label="Tükrözés"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"></path><path d="M8 7L3 12l5 5V7z"></path><path d="M16 7l5 5-5 5V7z"></path></svg></button>
        <button class="btn b-ghost" id="eDel" aria-label="Vissza a tálcára"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B3264A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M6 6l1 15h10l1-15"></path></svg></button>
        <button class="btn b-ghost nud" id="eL" aria-label="Balra"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button><button class="btn b-ghost nud" id="eU" aria-label="Fel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15l7-7 7 7"></path></svg></button><button class="btn b-ghost nud" id="eD" aria-label="Le"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"></path></svg></button><button class="btn b-ghost nud" id="eR" aria-label="Jobbra"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </div>
      <div class="acts" id="acts"></div>
    </div>
  </section>

    var o = owned(), nt = Object.keys(o.tools).length;
    $('colSub').textContent = nt + ' / ' + KG.CATALOG_TOTAL + ' ' + t('found');
    var h = '<div class="sec">' + t('tools') + '</div><div id="colGrid">';
    KG.COLLECTIBLE.forEach(function (g) { h += o.tools[g] ? '<div class="cbox b-card"><canvas width="140" height="100" data-g="' + g + '"></canvas>' + KG.tn(GD[g].name) + '</div>' : '<div class="cbox lock"><span class="q">?</span>' + t('locked') + '</div>'; });
    h += '</div>';
    h += '<div class="sec">' + t('balls') + '</div><div id="colGrid" style="display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:10px">';
    Object.keys(KG.BALLS).forEach(function (col) { h += o.balls[col] ? '<div class="cbox b-card"><canvas width="100" height="100" data-b="' + col + '" style="width:calc(44*var(--u));height:calc(44*var(--u))"></canvas>' + KG.tn(KG.BALLS[col].name) + '</div>' : '<div class="cbox lock"><span class="q">?</span></div>'; });
    h += '</div>';
    $('colBody').innerHTML = h;
    document.querySelectorAll('#colBody canvas[data-g]').forEach(function (c) { gadgetIcon(c, { g: c.getAttribute('data-g') }); });
    document.querySelectorAll('#colBody canvas[data-b]').forEach(function (c) { var x = c.getContext('2d'); KG.drawBall(x, 50, 50, 42, c.getAttribute('data-b'), 0.5); });
  }

  /* ================== BEÁLLÍTÁSOK ================== */
  function renderSettings() {
    show('settings'); applyTexts();
    var langs = Object.keys(KG.LANGS).map(function (k) { return '<button data-lang="' + k + '" class="' + (S.lang === k ? 'on' : '') + '">' + KG.LANGS[k] + '</button>'; }).join('');
    $('setBody').innerHTML =
      '<div class="setrow b-card"><span class="sp">' + t('language') + '</span><div class="seg">' + langs + '</div></div>' +
      '<div class="setrow b-card"><span class="sp">' + t('sound') + '</span><div class="seg"><button data-snd="1" class="' + (S.sound ? 'on' : '') + '">' + t('on') + '</button><button data-snd="0" class="' + (!S.sound ? 'on' : '') + '">' + t('off') + '</button></div></div>' +
      '<div class="setrow b-card"><span class="sp">' + t('unlock_all') + '</span><div class="seg"><button data-ul="1" class="' + (S.unlockAll ? 'on' : '') + '">' + t('on') + '</button><button data-ul="0" class="' + (!S.unlockAll ? 'on' : '') + '">' + t('off') + '</button></div></div>' +
      '<button class="btn b-card" id="btnReset" style="height:54px;font-size:17px">' + t('reset') + '</button>' +
      '<div style="grid-column:1/-1;text-align:center;font-size:12px;font-weight:700;color:#4A5A72;padding:8px">Ball Chain Reaction ' + VERSION + '</div>';
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.onclick = function () { S.lang = KG.lang = b.getAttribute('data-lang'); save(); renderSettings(); }; });
    document.querySelectorAll('[data-snd]').forEach(function (b) { b.onclick = function () { S.sound = KG.soundOn = b.getAttribute('data-snd') === '1'; save(); sfx('tap'); renderSettings(); }; });
    document.querySelectorAll('[data-ul]').forEach(function (b) { b.onclick = function () { S.unlockAll = b.getAttribute('data-ul') === '1'; save(); sfx('tap'); renderSettings(); }; });
    $('btnReset').onclick = function () {
      modal('<p style="font-size:18px">' + t('reset_q') + '</p><div class="row2"><button class="btn b-acc" id="rY">' + t('yes') + '</button><button class="btn b-ghost" id="rN">' + t('no') + '</button></div>', true);
      $('rY').onclick = function () { S.stars = []; S.sandbox = []; save(); closeModal(); renderSettings(); };
      $('rN').onclick = closeModal;
    };
  }

  /* ================== INDÍTÁS ================== */
  function boot() {
    load();
    document.querySelectorAll('.back').forEach(function (b) { b.onclick = function () { sfx('tap'); var go = b.getAttribute('data-go'); if (go === 'worlds') renderWorlds(); else show(go); }; });
    $('btnSettings').onclick = function () { sfx('unlock'); sfx('tap'); renderSettings(); };
    $('mPlay').onclick = function () { sfx('unlock'); sfx('tap'); renderWorlds(); };
    $('mCol').onclick = function () { sfx('unlock'); sfx('tap'); renderCollection(); };
    $('mSand').onclick = function () { sfx('unlock'); sfx('tap'); startSandbox(); };
    var app = G.BallChainApp || G.KugelbahnApp;
    if (G.BallChainApp) document.documentElement.classList.add('native');
    if ((app && app.exit) || /; wv\)/.test(navigator.userAgent)) {
      $('btnExit').style.display = '';
      $('btnExit').onclick = function () {
        sfx('tap');
        modal('<p style="font-size:19px">' + t('exit_q') + '</p><div class="row2"><button class="btn b-acc" id="xY">' + t('exit') + '</button><button class="btn b-ghost" id="xN">' + t('no') + '</button></div>', true);
        $('xY').onclick = function () { save(); if (app && app.exit) app.exit(); };
        $('xN').onclick = closeModal;
      };
    }
    KG.IMG = {};
    // átlátszó szélek levágása, hogy a tárgy pontosan kitöltse a helyét (ha a WebView engedi)
    function trimImg(im) {
      try {
        var w = im.naturalWidth, h = im.naturalHeight, c = document.createElement('canvas'); c.width = w; c.height = h;
        var x = c.getContext('2d'); x.drawImage(im, 0, 0); var d = x.getImageData(0, 0, w, h).data;
        var x0 = w, y0 = h, x1 = -1, y1 = -1;
        for (var y = 0; y < h; y++) for (var i = 0; i < w; i++) if (d[(y * w + i) * 4 + 3] > 24) { if (i < x0) x0 = i; if (i > x1) x1 = i; if (y < y0) y0 = y; if (y > y1) y1 = y; }
        if (x1 < 0 || (x0 === 0 && y0 === 0 && x1 === w - 1 && y1 === h - 1)) return im;
        var o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
        o.getContext('2d').drawImage(im, -x0, -y0); return o;
      } catch (e) { return im; }
    }
    var names = ['bg_w1', 'bg_menu', 'plank150', 'plank270', 'wall', 'trampoline', 'book', 'block', 'seesaw', 'pivot', 'catapult', 'car', 'button', 'button_on', 'gate', 'bell', 'basket', 'shelf', 'starter', 'trapdoor', 'sandbag', 'pendulum', 'fan', 'toaster', 'conveyor', 'plunger', 'bumper', 'funnel', 'pipe_in', 'pipe_out', 'magnet', 'lamp', 'lamp_on', 'pin', 'domino', 'wheel', 'hourglass', 'candle', 'candle_on', 'bg_w2', 'bg_w3', 'bg_w4', 'bg_w5', 'bg_w6', 'bg_w7', 'bg_w8', 'bg_w9', 'bg_w10'].concat(Object.keys(KG.BALLS).map(function (k) { return 'ball_' + k; })).concat(Object.keys(GD).filter(function (k) { return ['ball', 'probe', 'panel', 'drop'].indexOf(k) < 0; })); if (G.KG_IMGLIST) names = G.KG_IMGLIST; var left = names.length, started = false;
    if (!left) setTimeout(function () { go(); }, 0);
    function go() { if (started) return; started = true; if (KG.IMG.bg_menu) $('home').style.background = 'url(img/bg_menu.png) center / cover no-repeat'; show('home'); }
    names.forEach(function (n) { var im = new Image(); im.onload = function () { KG.IMG[n] = n.indexOf('bg_') === 0 ? im : trimImg(im); if (--left === 0) go(); }; im.onerror = function () { if (--left === 0) go(); }; im.src = 'img/' + n + '.png'; });
    setTimeout(go, 1200);
    G.kbBack = function () {
      if ($('modal').classList.contains('on')) { closeModal(); return true; }
      if ($('game').classList.contains('on')) { $('gBack').click(); return true; }
      if ($('levels').classList.contains('on')) { renderWorlds(); return true; }
      if (!$('home').classList.contains('on')) { show('home'); return true; }
      return false;
    };
  }
  KG._test = { startLevel: startLevel, get GS() { return GS; }, show: show, solve: function () { var gs = GS; gs.placed = gs.lv.sol.map(function (s) { return Object.assign({}, s); }); rebuild(gs); renderTray(gs); renderActs(gs); }, run: function () { run(GS); }, S: function () { return S; } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window);

</script>
